<div class="card text-white bg-secondary mb-3">
  <div class="card-header">Clientes</div>
  <div class="card-body">
    <div class="my-2 text-left">
      <button class="btn btn-primary" type="button" [routerLink]="['/cliente/crearClientes']">Crear Cliente</button>
    </div>
    <h5 class="card-title">Listado de clientes</h5>

    <div *ngIf="clientes.length === 0" class="alert alert-info">
      No hay registros en la base de datos
    </div>

    <table *ngIf="clientes.length > 0" class="table table-bordered table-striped">
      <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Email</th>
        <th>Fecha</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let cliente of clientes">
        <td>{{ cliente.id }}</td>
        <td>{{ cliente.nombre }}</td>
        <td>{{ cliente.apellido }}</td>
        <td>{{ cliente.email }}</td>
        <td>{{ cliente.createAt | date: 'dd/MM/yyyy' }}</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
